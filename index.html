<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation: Cosmic Celebration</title>
  <meta name="description" content="로키와 함께 함선 사고를 해결하다가 생일 서프라이즈를 발견하는 인터랙티브 웹 경험." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="starfield" aria-hidden="true"></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div id="bg-layer" class="pixel-art" aria-hidden="true"></div>
  <div id="noise-layer" aria-hidden="true"></div>
  <div id="flash-layer" aria-hidden="true"></div>

  <main id="app" class="app" data-state="BOOT">
    <section id="audio-start-screen" class="audio-start-screen">
      <div class="audio-start-inner">
        <div id="audio-start-text" class="audio-start-text"></div>
        <div id="audio-start-hint" class="audio-start-hint hidden">CLICK</div>
      </div>
    </section>

    <section id="boot-screen" class="boot-screen hidden">
      <button id="boot-btn" class="pixel-btn primary glow-btn">
        <span class="btn-label">▶ SYSTEM BOOT</span>
        <span class="btn-sub">[ Click to Start ]</span>
      </button>
    </section>

    <section id="mission-screen" class="mission-screen hidden">
      <header class="system-header">
        <div>
          <span class="header-label">MISSION STATUS</span>
          <strong id="state-label">BOOT</strong>
        </div>
        <div>
          <span class="header-label">WARNING</span>
          <strong id="warning-label">AUDIO LOCKED</strong>
        </div>
        <div>
          <span class="header-label">ROUTE</span>
          <strong id="route-label">EARTH / UNKNOWN</strong>
        </div>
      </header>

      <aside id="evidence-dock" class="evidence-dock" aria-label="Evidence board"></aside>

      <div class="main-visual">
        <div class="visual-panel">
          <div id="mission-title" class="mission-title"></div>
          <div id="system-log" class="system-log"></div>
          <div id="interaction-zone" class="interaction-zone"></div>
        </div>
      </div>

      <aside class="rocky-dialogue">
        <div class="rocky-avatar">
          <img id="rocky-img" class="pixel-art" src="assets/images/rocky.gif" alt="Rocky" />
          <span>ROCKY</span>
        </div>
        <div class="dialogue-box">
          <div class="dialogue-header">
            <span></span><span></span><span></span>
            <b>ROCKY_COMM</b>
          </div>
          <p id="rocky-text"></p>
        </div>
      </aside>

      <nav class="action-row">
        <button id="primary-action" class="pixel-btn primary hidden"></button>
        <button id="rocky-help" class="pixel-btn secondary hidden">로키에게 맡기기</button>
      </nav>
    </section>
  </main>

  <audio id="bgm" preload="auto" loop></audio>
  <script src="main.js"></script>
</body>
</html>
